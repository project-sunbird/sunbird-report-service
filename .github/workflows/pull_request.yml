name: Code Quality Checks

on:
  pull_request:
    branches:
      - '**'

jobs:
  code-quality:
    name: Run Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.15'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
